{% set name = "turbo-picard-picard-shim" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../../..

build:
  number: 0
  skip: true  # [win]
  script_env:
    - CARGO_NET_GIT_FETCH_WITH_CLI=true

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - clangdev
    - make
    - pkg-config
  host:
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz
  run:
    - {{ pin_subpackage('turbo-picard', exact=True) }}
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz
  run_constrained:
    - picard ==0

test:
  commands:
    - picard --version
    - picard MarkDuplicates --help

about:
  home: https://github.com/turbo-picard/turbo-picard
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Opt-in picard command shim for turbo-picard.
  description: |
    Installs a picard compatibility entrypoint backed by turbo-picard. This
    package intentionally conflicts with upstream picard because it shadows the
    same command name.

extra:
  recipe-maintainers:
    - replace-with-bioconda-maintainer
