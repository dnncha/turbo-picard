{% set name = "turbo-picard" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../../..

build:
  number: 0
  skip: true  # [win]
  script_env:
    - CARGO_NET_GIT_FETCH_WITH_CLI=true

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - clangdev
    - make
    - pkg-config
  host:
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz
  run:
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz

test:
  commands:
    - turbo-picard --version
    - turbo-picard MarkDuplicates --help
    - turbo-picard SortSam --help
    - turbo-picard CleanSam --help
    - turbo-picard MergeSamFiles --help
    - turbo-picard BuildBamIndex --help
    - turbo-picard SamToFastq --help
    - turbo-picard AddOrReplaceReadGroups --help
    - turbo-picard CollectAlignmentSummaryMetrics --help
    - turbo-picard CollectQualityYieldMetrics --help
    - turbo-picard QualityScoreDistribution --help
    - turbo-picard MeanQualityByCycle --help
    - turbo-picard CollectInsertSizeMetrics --help
    - turbo-picard CollectMultipleMetrics --help
    - turbo-picard FixMateInformation --help
    - turbo-picard IntervalListTools --help
    - turbo-picard RevertSam --help
    - turbo-picard SetNmMdAndUqTags --help
    - turbo-picard ValidateSamFile --help
    - turbo-picard LiftoverVcf --help
    - turbo-picard CreateSequenceDictionary --help
    - turbo-picard NormalizeFasta --help
    - turbo-picard BedToIntervalList --help
    - turbo-picard ViewSam --help
    - turbo-picard ReplaceSamHeader --help
    - turbo-picard UpdateVcfSequenceDictionary --help
    - turbo-picard GatherVcfs --help
    - turbo-picard SortVcf --help
    - turbo-picard MergeVcfs --help

about:
  home: https://github.com/dnncha/turbo-picard
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast Picard-compatible toolkit with native high-impact Picard commands.
  description: |
    turbo-picard is a Rust implementation of high-impact Picard workflows.
    The current native engines target high-impact SAM/BAM, metrics, FASTA, and
    interval workflows. This package installs the non-shadowing turbo-picard
    command entrypoint only; install turbo-picard-picard-shim to opt into a
    picard compatibility shim.

extra:
  recipe-maintainers:
    - replace-with-bioconda-maintainer
