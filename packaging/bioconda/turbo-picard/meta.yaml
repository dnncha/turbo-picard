{% set name = "turbo-picard" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../../..

build:
  number: 0
  skip: true  # [win]
  script_env:
    - CARGO_NET_GIT_FETCH_WITH_CLI=true

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - clangdev
    - make
    - pkg-config
  host:
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz
  run:
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz

test:
  commands:
    - turbo-picard --version
    - picard --version
    - turbo-picard MarkDuplicates --help
    - turbo-picard SortSam --help
    - turbo-picard SamToFastq --help
    - turbo-picard AddOrReplaceReadGroups --help
    - turbo-picard CollectAlignmentSummaryMetrics --help
    - turbo-picard CreateSequenceDictionary --help

about:
  home: https://github.com/turbo-picard/turbo-picard
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast Picard-compatible toolkit with native high-impact Picard commands.
  description: |
    turbo-picard is a Rust implementation of high-impact Picard workflows.
    The current native engines target MarkDuplicates, SortSam, SamToFastq,
    AddOrReplaceReadGroups, CollectAlignmentSummaryMetrics, and
    CreateSequenceDictionary workflows and install both turbo-picard and picard
    command entrypoints.

extra:
  recipe-maintainers:
    - replace-with-bioconda-maintainer
