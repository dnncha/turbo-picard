[package]
name = "turbo-picard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
description = "Picard-compatible command-line entrypoint for turbo-picard."
default-run = "turbo-picard"

[[bin]]
name = "turbo-picard"
path = "src/main.rs"

[[bin]]
name = "picard"
path = "src/bin/picard.rs"

[dependencies]
rust-htslib = "1.0.0"
md5 = "0.7.0"
turbo-picard-core = { path = "../turbo-picard-core" }
turbo-picard-markdup = { path = "../turbo-picard-markdup" }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
