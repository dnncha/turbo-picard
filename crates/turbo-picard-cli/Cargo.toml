[package]
name = "turbo-picard-cli"
version = "0.1.0"
edition = "2024"
default-run = "turbo-picard"

[[bin]]
name = "turbo-picard"
path = "src/main.rs"

[[bin]]
name = "picard"
path = "src/bin/picard.rs"

[dependencies]
turbo-picard-core = { path = "../turbo-picard-core" }
turbo-picard-markdup = { path = "../turbo-picard-markdup" }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
