name: Website delivery audit
on:
  push:
    branches: [website/problem-led-discovery-20260906]
    paths: [.github/workflows/website-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public hosting responses
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path
          urls = [
            'https://turbo-picard.readthedocs.io/en/latest/',
            'https://turbo-picard.readthedocs.io/en/latest/quickstart.html',
            'https://turbo-picard.readthedocs.io/robots.txt',
            'https://turbo-picard.readthedocs.io/sitemap.xml',
            'https://app.readthedocs.org/api/v3/projects/turbo-picard/builds/?limit=3',
            'https://dnncha.github.io/turbo-picard/',
          ]
          results=[]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TurboPicardWebsiteAudit/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      body=response.read(500000).decode('utf-8','replace')
                      row={'url':url,'status':response.status,'final_url':response.url,'headers':dict(response.headers),'body':body}
              except Exception as e:
                  row={'url':url,'error':str(e)}
              results.append(row)
              print(json.dumps({k:(v[:900] if k=='body' else v) for k,v in row.items()}))
          Path('/tmp/hosting-audit.json').write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-picard-website-delivery-audit
          path: /tmp/hosting-audit.json
          retention-days: 7
