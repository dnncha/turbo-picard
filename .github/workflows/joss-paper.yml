name: JOSS Paper

on:
  push:
    paths:
      - "paper/**"
      - "README.md"
      - "docs/joss-submission.rst"
      - "tools/verify_joss_paper.py"
      - ".github/workflows/joss-paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "README.md"
      - "docs/joss-submission.rst"
      - "tools/verify_joss_paper.py"
      - ".github/workflows/joss-paper.yml"
  workflow_dispatch:

jobs:
  paper:
    name: Build paper
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check paper metadata
        run: python3 tools/verify_joss_paper.py

      - name: Build JOSS PDF
        run: |
          docker run --rm \
            --volume "$PWD/paper:/data" \
            --user "$(id -u):$(id -g)" \
            --env JOURNAL=joss \
            openjournals/inara

      - name: Upload paper PDF
        uses: actions/upload-artifact@v6
        with:
          name: joss-paper
          path: paper/paper.pdf
          if-no-files-found: error
