name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built distributions to PyPI"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: 2014
          before-script-linux: |
            yum install -y perl-core llvm-toolset-7.0-clang-devel
            source /opt/rh/llvm-toolset-7.0/enable
            export LIBCLANG_PATH=/opt/rh/llvm-toolset-7.0/root/usr/lib64
            test -f "$LIBCLANG_PATH/libclang.so"
          args: --release --locked --compatibility pypi --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  linux-aarch64:
    name: Build Linux ARM64 wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: 2014
          before-script-linux: |
            apt-get update
            apt-get install -y --no-install-recommends perl libclang-dev libc6-dev-arm64-cross
            export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name libclang.so -print -quit)")"
            test -f "$LIBCLANG_PATH/libclang.so"
            target_header="$(find /usr -path '*/aarch64*/include/bits/libc-header-start.h' -print -quit)"
            target_sysroot="${target_header%/include/bits/libc-header-start.h}"
            test -f "$target_sysroot/include/bits/libc-header-start.h"
            export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu="--target=aarch64-unknown-linux-gnu --sysroot=$target_sysroot"
          args: --release --locked --compatibility pypi --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: dist

  macos:
    name: Build macOS wheels
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --locked --compatibility pypi --out dist

      - name: Smoke-test macOS arm64 wheel
        run: bash tools/verify_pypi_wheel_install_smoke.sh dist/turbo_picard-*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist

  macos-x86_64:
    name: Build macOS Intel wheels
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --compatibility pypi --out dist

      - name: Smoke-test macOS Intel wheel
        run: bash tools/verify_pypi_wheel_install_smoke.sh dist/turbo_picard-*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  validate:
    name: Validate distributions
    runs-on: ubuntu-latest
    needs: [linux, linux-aarch64, macos, macos-x86_64, sdist]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate publishing ref
        if: github.event_name == 'release' || inputs.publish == 'true'
        run: |
          set -euo pipefail
          expected_ref="v$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("Cargo.toml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\[workspace\.package\]\s+.*?^version\s*=\s*\"([^\"]+)\"",
              text,
          )
          if match is None:
              raise SystemExit("Cargo.toml is missing [workspace.package] version")
          print(match.group(1))
          PY
          )"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "${expected_ref}"

      - name: Install verifier dependency
        run: python3 -m pip install PyYAML==6.0.3

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate release metadata and artifact contents
        run: |
          python3 tools/verify_release_versions.py
          python3 tools/verify_pypi_package.py
          python3 tools/verify_release_artifacts.py --dist dist
          python3 tools/verify_markduplicates_guardrails.py

      - name: Build release handoff manifest
        run: |
          python3 tools/build_release_manifest.py \
            --dist dist \
            --output "$RUNNER_TEMP/turbo-picard-release-manifest.json"

      - name: Upload release handoff manifest
        uses: actions/upload-artifact@v4
        with:
          name: turbo-picard-release-manifest
          path: ${{ runner.temp }}/turbo-picard-release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Smoke-test Linux x86_64 wheel
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/turbo-picard-release-smoke"
          python3 -m venv "$smoke_root"
          smoke_bin="$smoke_root/bin"
          "$smoke_bin/python" -m pip install --no-deps dist/turbo_picard-*-manylinux_2_17_x86_64*.whl
          "$smoke_bin/python" -m pip check
          "$smoke_bin/turbo-picard" --version
          "$smoke_bin/turbo-picard" doctor
          "$smoke_bin/turbo-picard" trial MarkDuplicates I=input.bam O=marked.bam M=metrics.txt
          "$smoke_bin/picard" --version
          PATH="$smoke_bin:$PATH" bash tools/verify_install_smoke.sh
          PATH="$smoke_bin:$PATH" TURBO_PICARD_BIN="$smoke_bin/turbo-picard" bash tools/verify_mate_barcode_install_smoke.sh

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, linux-aarch64, macos, macos-x86_64, sdist, validate]
    if: (github.event_name == 'release' || inputs.publish == 'true') && github.ref_type == 'tag'
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify live PyPI metadata
        run: python3 tools/verify_pypi_package.py --live --retries 12 --retry-delay 5
