name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built distributions to PyPI"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: 2014
          before-script-linux: |
            yum install -y perl-core llvm-toolset-7.0-clang-devel
            source /opt/rh/llvm-toolset-7.0/enable
            export LIBCLANG_PATH=/opt/rh/llvm-toolset-7.0/root/usr/lib64
            test -f "$LIBCLANG_PATH/libclang.so"
          args: --release --locked --compatibility pypi --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  linux-aarch64:
    name: Build Linux ARM64 wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: 2014
          before-script-linux: |
            apt-get update
            apt-get install -y --no-install-recommends perl libclang-dev
            export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name libclang.so -print -quit)")"
            test -f "$LIBCLANG_PATH/libclang.so"
            target_header="$(find /usr -path '*/aarch64*/include/bits/libc-header-start.h' -print -quit)"
            target_sysroot="${target_header%/include/bits/libc-header-start.h}"
            test -f "$target_sysroot/include/bits/libc-header-start.h"
            export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu="--target=aarch64-unknown-linux-gnu --sysroot=$target_sysroot"
          args: --release --locked --compatibility pypi --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: dist

  macos:
    name: Build macOS wheels
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --locked --compatibility pypi --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist

  macos-x86_64:
    name: Build macOS Intel wheels
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --compatibility pypi --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, linux-aarch64, macos, macos-x86_64, sdist]
    if: github.event_name == 'release' || inputs.publish == 'true'
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
