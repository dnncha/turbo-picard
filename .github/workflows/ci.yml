name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev make pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Test Python tooling
        run: |
          python3 -m pip install PyYAML==6.0.3
          # Discover every test, including newly added regression modules.
          python3 -m unittest discover -s tools
          python3 -m compileall -q tools
          python3 tools/verify_public_adoption_report.py --help >/dev/null
          python3 tools/sync_picard_command_matrix.py
          git diff --exit-code docs/command-matrix.yml docs/picard-3.4.0-commands.txt
          python3 tools/verify_command_matrix.py
          python3 tools/verify_parity_docs.py
          python3 tools/verify_pypi_package.py
          python3 tools/verify_bioconda_recipes.py
          python3 tools/verify_chart_disclosures.py
          python3 tools/verify_ci_coverage.py
          python3 tools/verify_joss_paper.py
          python3 tools/verify_benchmark_log_evidence.py
          python3 tools/verify_benchmark_suite_coverage.py
          python3 tools/verify_benchmark_thresholds.py
          python3 tools/verify_readme_benchmark_evidence.py
          python3 tools/verify_benchmark_claim_surfaces.py
          python3 tools/verify_readme_links.py
          python3 tools/verify_real_data_ci_coverage.py
          python3 tools/verify_real_data_evidence.py
          python3 tools/verify_real_data_evidence.py --release-ready
          python3 tools/verify_release_artifacts.py --source-only
          python3 tools/verify_markduplicates_guardrails.py
          python3 tools/verify_production_evidence_workflow.py
          python3 tools/verify_publish_workflows.py
          python3 tools/verify_release_text_quality.py
          python3 tools/verify_release_versions.py
          set +e
          python3 tools/prepare_bioconda_release.py --sha256 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef --check
          release_helper_check_status=$?
          set -e
          test "$release_helper_check_status" -eq 1
          python3 tools/verify_site_disclosures.py
          python3 tools/verify_site_benchmark_evidence.py
          python3 tools/verify_site_links.py
          python3 tools/build_marketing_site.py --check
          python3 tools/verify_marketing_site.py
          python3 tools/verify_workflow_starters.py

      - name: Verify benchmark evidence assets are current
        run: |
          python3 tools/render_benchmark_assets.py
          git diff --exit-code -- \
            docs/site/assets/benchmark-data.json \
            docs/site/assets/benchmark-speedups.svg \
            docs/site/assets/hero-pipeline.svg

      - name: Build Sphinx docs
        run: |
          python3 -m pip install -r docs/requirements.txt
          python3 -m sphinx -W -b html docs docs/_build/html
          python3 tools/verify_marketing_site.py --built-dir docs/_build/html

      - name: Smoke package install
        run: ./tools/verify_package_install.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build reference container
        run: docker build -t turbo-picard:ci .
      - name: Smoke container entrypoint
        run: docker run --rm turbo-picard:ci MarkDuplicates --help

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install pinned miniwdl trial runtime
        run: python3 -m pip install "miniwdl==1.15.0"

      - name: Build WDL runtime image
        run: |
          docker build -t turbo-picard-wdl:ci -f - . <<'EOF'
          FROM turbo-picard:ci
          ENTRYPOINT []
          EOF

      - name: Test WDL starters
        env:
          TURBO_PICARD_WDL_IMAGE: turbo-picard-wdl:ci
        run: bash tools/verify_wdl_starters.sh

  nf-core-process:
    name: nf-core process candidate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev make pkg-config

      - name: Build turbo-picard executable
        run: cargo build --release --locked -p turbo-picard-cli --bin turbo-picard

      - name: Install pinned Nextflow and nf-test
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://github.com/nextflow-io/nextflow/releases/download/v26.04.6/nextflow-26.04.6-dist -o "$RUNNER_TEMP/nextflow"
          echo "182a63c74074e2dc7956ffa3c8cd59de952ed2c44394e21faf5e1736b945444c  $RUNNER_TEMP/nextflow" | sha256sum --check
          chmod +x "$RUNNER_TEMP/nextflow"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://github.com/askimed/nf-test/releases/download/v0.9.5/nf-test-0.9.5.tar.gz -o "$RUNNER_TEMP/nf-test.tar.gz"
          echo "b7679eb90cdc9642bfa89e9634db02ce6e699de53ad35ef0e2f4847634fc1641  $RUNNER_TEMP/nf-test.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nf-test.tar.gz" -C "$RUNNER_TEMP" nf-test.jar

      - name: Test nf-core process candidate
        env:
          NXF_HOME: ${{ runner.temp }}/nextflow-home
          TURBO_PICARD_REPO_ROOT: ${{ github.workspace }}
        run: |
          PATH="$RUNNER_TEMP:$GITHUB_WORKSPACE/target/release:$PATH" \
            java -jar "$RUNNER_TEMP/nf-test.jar" \
            test packaging/nf-core/tests/main.nf.test

  snakemake-starter:
    name: Snakemake starter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev make pkg-config

      - name: Build turbo-picard executable
        run: cargo build --release --locked -p turbo-picard-cli --bin turbo-picard

      - name: Install pinned Snakemake trial runtime
        run: python3 -m pip install "snakemake==7.32.4" "PuLP==2.7.0"

      - name: Test Snakemake starter
        env:
          TURBO_PICARD_BIN: ${{ github.workspace }}/target/release/turbo-picard
        run: bash tools/verify_snakemake_starter.sh

  picard-parity:
    name: Picard parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev make pkg-config

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: turbo-picard-ci
          create-args: >-
            -c conda-forge
            -c bioconda
            picard=3.4.0
            samtools

      - name: Test workspace
        run: cargo test --workspace

      - name: Verify Picard parity
        run: |
          ./tools/verify_basic_accelerationstatus_parity.sh
          ./tools/verify_basic_capabilities_parity.sh
          ./tools/verify_basic_doctor_parity.sh
          ./tools/verify_basic_explain_parity.sh
          ./tools/verify_basic_trial_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_cram_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_markdup_cram_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_gatk_preprocessing_combo_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_gatk_mito_bam_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_gatk_mito_cram_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_gatk_preprocessing_combo_cram_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/validate_gatk_mito_cram_evidence.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_picard_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_sortsam_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_cleansam_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_mergesamfiles_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_buildbamindex_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_samtofastq_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_fastqtosam_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_addorreplacereadgroups_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_alignmentmetrics_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_collectbasedistributionbycycle_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_collectgcbiasmetrics_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_collecthsmetrics_parity.sh

          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_qualityyield_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_collectwgsmetrics_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_qualityscoredistribution_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_meanqualitybycycle_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_collectinsertsizemetrics_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_collectmultiplemetrics_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_fixmateinformation_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_intervallisttools_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_revertsam_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_setnmmdanduqtags_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_validatesamfile_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_liftovervcf_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_createdict_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_normalizefasta_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_bedtointervallist_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_viewsam_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_replacesamheader_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_updatevcfsequencedictionary_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_gathervcfs_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_sortvcf_parity.sh
          TURBO_PICARD_CONDA_PREFIX="${MAMBA_ROOT_PREFIX}/envs/turbo-picard-ci" ./tools/verify_basic_mergevcfs_parity.sh
