name: Validate complete 0.1.13 candidate
on:
  push:
    branches: [release/0.1.13]
    paths: [.github/workflows/prepare-0.1.13.yml]
permissions:
  contents: write
concurrency:
  group: prepare-turbo-picard-0.1.13
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and comparison prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-dev pkg-config make samtools
          python3 -m pip install PyYAML==6.0.3 -r docs/requirements.txt
      - name: Apply integrity-checked candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/0.1.13'
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          parts = ['1', '2', '3', '4a', '4b', '5']
          encoded = ''.join(Path(f'.github/release-patch.{part}.b64').read_text().strip() for part in parts)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '46c2703d29c0891bd3a61c7977a0e41db5b5f5721a3493c042e8443b49568483'
          Path('/tmp/candidate.patch').write_bytes(patch)
          PY
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          cargo fmt --all
          git diff --check
      - name: Compile and test native workspace including heap merge
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace 2>&1 | tee /tmp/rust-tests.log
      - name: Run repository Python and release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/python-release-tests.log
          import subprocess, yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path('.github/workflows/ci.yml').read_text())
          step = next(step for step in workflow['jobs']['rust']['steps'] if step.get('name') == 'Test Python tooling')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], check=True)
          PY
      - name: Build documentation with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m sphinx -W -b html docs docs/_build/html 2>&1 | tee /tmp/sphinx-tests.log
      - name: Commit validated product sources to release branch only
        shell: bash
        run: |
          set -euo pipefail
          git add .readthedocs.yaml AGENTS.md CHANGELOG.md CITATION.cff Cargo.lock Cargo.toml README.md pyproject.toml benchmarks/validation-memory crates docs packaging tools
          git diff --cached --check
          git diff --cached --stat | tee /tmp/product-diff-stat.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: prepare 0.1.13 with bounded validation, heap merge and workflow documentation'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve validation evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/tested-commit.txt
          git diff --binary > /tmp/uncommitted-source.patch
          git archive --format=tar.gz HEAD > /tmp/candidate-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbo-picard-0.1.13-candidate-evidence
          path: |
            /tmp/*-tests.log
            /tmp/product-diff-stat.txt
            /tmp/tested-commit.txt
            /tmp/uncommitted-source.patch
            /tmp/candidate-source.tar.gz
          retention-days: 7
