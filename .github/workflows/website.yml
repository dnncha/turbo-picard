name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'tools/*marketing*', 'tools/render_site_social.py', 'Cargo.toml', '.readthedocs.yaml', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'tools/*marketing*', 'tools/render_site_social.py', 'Cargo.toml', '.readthedocs.yaml', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned documentation and browser tools
        run: |
          python3 -m pip install -r docs/requirements.txt playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify source, planner and generated site
        run: |
          python3 -m unittest tools.test_marketing_site
          python3 tools/build_marketing_site.py --check
          python3 tools/verify_marketing_site.py
      - name: Build and verify actual documentation output
        run: |
          python3 -m sphinx -W -b html docs docs/_build/html
          python3 tools/verify_marketing_site.py --built-dir docs/_build/html
          # Repeat the build to guard against incremental overwrites of index.html.
          python3 -m sphinx -W -b html docs docs/_build/html
          python3 tools/verify_marketing_site.py --built-dir docs/_build/html
      - name: Exercise pages as a browser visitor
        run: python3 tools/check_marketing_browser.py --site docs/_build/html --output /tmp/turbo-site-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbo-picard-website-qa
          path: /tmp/turbo-site-qa
          retention-days: 14
