name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate release source metadata
        run: |
          set -euo pipefail
          python3 tools/verify_release_versions.py
          python3 tools/verify_release_artifacts.py --source-only
          python3 tools/verify_markduplicates_guardrails.py
          expected_tag="v$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("Cargo.toml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\[workspace\.package\]\s+.*?^version\s*=\s*\"([^\"]+)\"",
              text,
          )
          if match is None:
              raise SystemExit("Cargo.toml is missing [workspace.package] version")
          print(match.group(1))
          PY
          )"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test published image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if docker pull "${image}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep 5
          done
          docker run --rm "${image}" --version
          docker run --rm "${image}" doctor
          docker run --rm "${image}" trial MarkDuplicates I=input.bam O=marked.bam M=metrics.txt
          smoke_dir="${RUNNER_TEMP}/turbo-picard-container-smoke"
          mkdir -p "${smoke_dir}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${smoke_dir}:/out" \
            "${image}" MarkDuplicates \
            I=/workspace/fixtures/markduplicates/basic/input.bam \
            O=/out/marked.bam \
            M=/out/metrics.txt \
            VALIDATION_STRINGENCY=SILENT \
            QUIET=true
          test -s "${smoke_dir}/marked.bam"
          test -s "${smoke_dir}/metrics.txt"
