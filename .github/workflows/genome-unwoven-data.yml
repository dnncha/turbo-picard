name: Genome Unwoven independent evidence
on:
  push:
    branches: [research/genome-unwoven-data]
    paths: [research/genome-unwoven/build_genome.py, research/genome-unwoven/verify_independent.py, .github/workflows/genome-unwoven-data.yml]
permissions:
  contents: write
concurrency:
  group: genome-unwoven-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-download only the exact pinned public source snapshot
        run: |
          python - <<'PY'
          import importlib.util,json,pathlib
          spec=importlib.util.spec_from_file_location('builder','research/genome-unwoven/build_genome.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          manifest=json.loads(pathlib.Path('research/genome-unwoven/data/manifest.json').read_text())
          m.PINNED_SHA256={s['id']:s['sha256'] for s in manifest['sources']}
          cache=pathlib.Path('.cache/genome-unwoven');cache.mkdir(parents=True,exist_ok=True)
          for name in m.SOURCES:m.download(name,cache)
          PY
      - name: Independent sort-merge validation of all chromosomes and families
        run: |
          ulimit -v 2097152
          python research/genome-unwoven/verify_independent.py --data research/genome-unwoven/data --report research/genome-unwoven/validation.json
      - name: Probe optional external access without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          out={}
          try:
            url='https://api.genome.ucsc.edu/getData/track?genome=hg38;track=rmsk;chrom=chr1;start=10000;end=12000;maxItemsOutput=5'
            with urllib.request.urlopen(url,timeout=30) as r:
              data=json.load(r);out['ucsc']={'status':r.status,'cors':r.headers.get('Access-Control-Allow-Origin'),'records':data.get('rmsk'),'maxItemsLimit':data.get('maxItemsLimit')}
          except Exception as e:out['ucsc']={'errorType':type(e).__name__}
          token=os.environ.get('CLOUDFLARE_API_TOKEN','');out['cloudflare']={'configured':bool(token),'verified':False}
          if token:
            try:
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/user/tokens/verify',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=json.load(r);out['cloudflare']['verified']=bool(data.get('success'))
            except Exception as e:out['cloudflare']['errorType']=type(e).__name__
          pathlib.Path('probe.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Package the unchanged validated data snapshot
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path('research/genome-unwoven');dest=root/'genome-data.zip'
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted((root/'data').iterdir()):
              info=zipfile.ZipInfo(p.name,date_time=(2026,9,6,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;z.writestr(info,p.read_bytes())
          (root/'genome-data.sha256').write_text(hashlib.sha256(dest.read_bytes()).hexdigest()+'  genome-data.zip\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genome-unwoven-independent-evidence
          path: |
            research/genome-unwoven/genome-data.zip
            research/genome-unwoven/genome-data.sha256
            research/genome-unwoven/validation.json
            probe.json
          retention-days: 7
      - name: Preserve public data archive and scientific checks only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/genome-unwoven/genome-data.zip research/genome-unwoven/genome-data.sha256 research/genome-unwoven/validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Verify full reference coverage independently and package public snapshot'
          git push origin HEAD:research/genome-unwoven-data
