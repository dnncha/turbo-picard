name: Trial report
description: Share a real one-command evaluation, including a match, mismatch, or adoption blocker.
title: "[Trial] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing `turbo-picard` on a real workflow.

        Please keep this report public and reproducible without sharing clinical,
        human-subject, controlled-access, or otherwise private data. Summarized
        file shapes and redacted commands are enough.

  - type: input
    id: turbo-version
    attributes:
      label: turbo-picard version
      description: Paste the output of `turbo-picard --version`.
      placeholder: "0.1.11"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - PyPI wheel
        - Container image
        - Bioconda package
        - Source checkout
        - Other
    validations:
      required: true

  - type: input
    id: picard-version
    attributes:
      label: Upstream Picard version
      description: Enter the version used for comparison, or `not compared`.
      placeholder: "3.4.0"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Redacted command
      description: Include the command and options, replacing private paths and identifiers.
      placeholder: "turbo-picard MarkDuplicates I=input.bam O=marked.bam M=metrics.txt"
      render: shell
    validations:
      required: true

  - type: textarea
    id: input-shape
    attributes:
      label: Input shape
      description: Describe BAM, CRAM, FASTQ, VCF, or metrics inputs and a rough size or read count.
      placeholder: "Coordinate-sorted BAM, about 12 million read pairs, 18 GB"
    validations:
      required: true

  - type: dropdown
    id: fallback
    attributes:
      label: Fallback state
      options:
        - Native command without fallback
        - Fallback configured for unsupported commands
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Trial outcome
      options:
        - Outputs matched
        - Mismatch or regression
        - Could not complete the trial
        - Needed an unsupported option
    validations:
      required: true

  - type: textarea
    id: comparison
    attributes:
      label: Comparison and downstream impact
      description: Say what you compared, including outputs, sidecars, metrics, exit status, or downstream behavior.
      placeholder: "BAM and metrics matched after normalizing generated headers; downstream task completed."
    validations:
      required: true

  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: If available, include wall time, peak memory, shard count, and whether the runs used the same machine and inputs.
      placeholder: "Picard: 42 min; turbo-picard: 9 min; same 8-core runner; peak memory not measured."

  - type: textarea
    id: adoption-blocker
    attributes:
      label: Friction or next step
      description: Tell us what would make the next trial or workflow rollout easier.
      placeholder: "The command worked, but our container needs a pinned ARM64 image."

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and disclosure
      options:
        - label: I removed private paths, identifiers, sequences, and other sensitive data from this report.
          required: true
        - label: I understand that this issue and its contents are public.
          required: true
