[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "turbo-picard"
version = "0.1.18"
description = "Fast Rust command-line tools for selected Picard-compatible genomics workflows."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Donncha O'Toole" }]
keywords = [
  "bioinformatics",
  "genomics",
  "Picard",
  "SAM",
  "BAM",
  "CRAM",
  "VCF",
  "Rust",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://turbo-picard.readthedocs.io/en/latest/"
Documentation = "https://turbo-picard.readthedocs.io/"
Source = "https://github.com/dnncha/turbo-picard"
Issues = "https://github.com/dnncha/turbo-picard/issues"
Changelog = "https://github.com/dnncha/turbo-picard/releases"

[tool.maturin]
manifest-path = "crates/turbo-picard-cli/Cargo.toml"
bindings = "bin"
strip = true
include = [{ path = "LICENSE", format = "sdist" }]

[dependency-groups]
dev = ["pytest>=8", "PyYAML==6.0.3", "types-PyYAML"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
explicit_package_bases = true
files = ["tools", "benchmarks", "branding", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["fontTools", "fontTools.*", "playwright", "playwright.*", "pysam"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ANN", "S", "RUF", "SIM", "I", "PL", "PT", "C4", "RET", "ARG"]
ignore = ["S101", "S603", "S607", "PLR2004", "PLR0913", "PLR0912", "PLR0915", "PLR0911", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S", "PLR", "ARG"]
