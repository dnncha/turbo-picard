{% extends "!base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if pagename in ("search", "genindex") %}
    <meta name="robots" content="noindex,follow" />
  {% endif %}
  {% if tp_description %}
    <meta name="description" content="{{ tp_description|e }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turbo Picard" />
    <meta property="og:title" content="{{ title|striptags|e }}" />
    <meta property="og:description" content="{{ tp_description|e }}" />
    <meta property="og:url" content="https://turbo-picard.readthedocs.io/en/latest/{{ pagename }}.html" />
    <meta property="og:image" content="https://turbo-picard.readthedocs.io/en/latest/assets/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ title|striptags|e }}" />
    <meta name="twitter:description" content="{{ tp_description|e }}" />
  {% endif %}
  {% if pagename == "index" %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "turbo-picard",
        "description": "Rust command-line tools for selected Picard-compatible genomics workflows.",
        "codeRepository": "https://github.com/dnncha/turbo-picard",
        "downloadUrl": "https://pypi.org/project/turbo-picard/0.1.15/",
        "license": "https://spdx.org/licenses/MIT.html",
        "programmingLanguage": "Rust",
        "runtimePlatform": "Linux and macOS",
        "softwareVersion": "0.1.15",
        "applicationCategory": "Bioinformatics",
        "author": {
          "@type": "Person",
          "name": "Donncha O'Toole",
          "sameAs": "https://orcid.org/0009-0003-5012-7229"
        }
      }
    </script>
  {% endif %}
{% endblock %}
