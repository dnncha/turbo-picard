<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1210" viewBox="0 0 420 1210" role="img" aria-labelledby="title desc">
  <title id="title">The fastest MarkDuplicates we&#x27;ve measured. And the only one with Picard-identical output.</title>
  <desc id="desc">The fastest MarkDuplicates we&#x27;ve measured. And the only one with Picard-identical output. Turbo Picard 1.05 s versus Picard 5.42 s; FastDup 1.13 s (output differs from Picard); samtools markdup 1.98 s (output differs from Picard).</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071013"/>
      <stop offset="0.55" stop-color="#10212a"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="turbo" x1="0" x2="1">
      <stop offset="0" stop-color="#2fcfc2"/>
      <stop offset="1" stop-color="#9ef8f1"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .brand { font-weight: 700; font-size: 13px; letter-spacing: 2px; fill: #36d7c9; }
    .title { font-weight: 800; font-size: 31px; fill: #f4fbfb; }
    .sub { font-weight: 500; font-size: 15.5px; fill: #b7c9cf; }
    .groupOn { font-weight: 700; font-size: 12px; letter-spacing: 1.5px; fill: #36d7c9; }
    .groupOff { font-weight: 700; font-size: 12px; letter-spacing: 1.5px; fill: #6d8189; }
    .toolOn { font-weight: 800; font-size: 17px; fill: #f4fbfb; }
    .tool { font-weight: 600; font-size: 16px; fill: #d9e7ea; }
    .toolOff { font-weight: 600; font-size: 16px; fill: #7d9098; }
    .valueOn { font-weight: 800; font-size: 16px; fill: #9ef8f1; }
    .value { font-weight: 700; font-size: 15px; fill: #d9e7ea; }
    .valueOff { font-weight: 600; font-size: 15px; fill: #7d9098; }
    .track { fill: rgba(255,255,255,0.05); }
    .tile { fill: rgba(255,255,255,0.045); stroke: rgba(158,248,241,0.14); }
    .bigOn { font-weight: 800; font-size: 30px; fill: #9ef8f1; }
    .big { font-weight: 800; font-size: 30px; fill: #f4fbfb; }
    .tileText { font-weight: 600; font-size: 15px; fill: #d9e7ea; }
    .tileFine { font-weight: 500; font-size: 13px; fill: #8ba4ad; }
    .foot { font-weight: 500; font-size: 10.5px; fill: #6d8189; }
    .cmd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-weight: 600; font-size: 17px; fill: #f4fbfb; }
    .prompt { fill: #36d7c9; }
  </style>
  <rect width="420" height="1210" fill="url(#bg)"/>
  <text x="24" y="44" class="brand">TURBO PICARD</text>
  <text x="24" y="86" class="title">The fastest</text><text x="24" y="122" class="title">MarkDuplicates we&#x27;ve</text><text x="24" y="158" class="title">measured.</text>
  <text x="24" y="188" class="sub">And the only one with Picard-identical</text><text x="24" y="209" class="sub">output. Same commands, same arguments,</text><text x="24" y="230" class="sub">no JVM.</text>
  <text x="24" y="274" class="groupOn">PICARD-IDENTICAL OUTPUT</text><text x="24" y="308" class="toolOn">Turbo Picard</text><rect x="24" y="316" width="308" height="22" rx="7" class="track"/><rect x="24" y="316" width="59.9" height="22" rx="7" fill="url(#turbo)" filter="url(#glow)"/><text x="93.9" y="332" class="valueOn">1.05 s</text><text x="24" y="366" class="tool">Picard 3.4.0</text><rect x="24" y="374" width="308" height="22" rx="7" class="track"/><rect x="24" y="374" width="308.0" height="22" rx="7" fill="#3a5a63"/><text x="342.0" y="390" class="value">5.42 s</text><text x="24" y="424" class="groupOff">OUTPUT DIFFERS FROM PICARD</text><text x="24" y="458" class="toolOff">FastDup</text><rect x="24" y="466" width="308" height="22" rx="7" class="track"/><rect x="24" y="466" width="64.2" height="22" rx="7" fill="#2a3a40"/><text x="98.2" y="482" class="valueOff">1.13 s</text><text x="24" y="516" class="toolOff">samtools markdup</text><rect x="24" y="524" width="308" height="22" rx="7" class="track"/><rect x="24" y="524" width="112.6" height="22" rx="7" fill="#2a3a40"/><text x="146.6" y="540" class="valueOff">1.98 s</text>
  <rect x="24" y="578" width="372" height="68" rx="14" class="tile"/><text x="42" y="624" class="bigOn">5.1x</text><text x="162" y="608" class="tileText">faster than Picard</text><text x="162" y="628" class="tileFine">600k paired reads</text>
  <rect x="24" y="658" width="372" height="68" rx="14" class="tile"/><text x="42" y="704" class="big">11.2x</text><text x="162" y="688" class="tileText">less memory than Picard</text><text x="162" y="708" class="tileFine">600k paired reads</text>
  <rect x="24" y="738" width="372" height="68" rx="14" class="tile"/><text x="42" y="784" class="bigOn">19.0x</text><text x="162" y="768" class="tileText">faster than Picard</text><text x="162" y="788" class="tileFine">real NA12878 chrM, identical</text>
  <rect x="24" y="818" width="372" height="68" rx="14" class="tile"/><text x="42" y="864" class="big">32/32</text><text x="162" y="848" class="tileText">commands match Picard</text><text x="162" y="868" class="tileFine">85x geo-mean speedup</text>
  <rect x="24" y="902" width="372" height="136" rx="14" class="tile"/><text x="42" y="930" class="groupOn">GETTING FASTER ON MAIN</text><polyline points="42.0,958.0 70.0,952.8 98.0,940.0" fill="none" stroke="#36d7c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="98.0" cy="940.0" r="3.5" fill="#9ef8f1"/><text x="114" y="960" class="tileText">MarkDuplicates paired, 600k</text><text x="114" y="977" class="tileFine">0.1.15 → #46</text><text x="378" y="960" text-anchor="end" class="valueOn">−64%</text><polyline points="42.0,1004.0 70.0,999.3 98.0,986.0" fill="none" stroke="#36d7c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="98.0" cy="986.0" r="3.5" fill="#9ef8f1"/><text x="114" y="1006" class="tileText">MarkDuplicates paired, 1.2M</text><text x="114" y="1023" class="tileFine">0.1.15 → #46</text><text x="378" y="1006" text-anchor="end" class="valueOn">−60%</text>
  <rect x="24" y="1054" width="372" height="48" rx="12" class="tile"/><text x="44" y="1085" class="cmd"><tspan class="prompt">$</tspan><tspan dx="12">pip install turbo-picard</tspan></text>
  <text x="24" y="1134" class="foot">MarkDuplicates, 600k paired reads, 1 CPU, median of 3. Turbo</text><text x="24" y="1150" class="foot">Picard 0.1.16 (a4aeaa8+patch), measured 2026-10-25. Command</text><text x="24" y="1166" class="foot">suite 2026-08-14. Evidence:</text><text x="24" y="1182" class="foot">github.com/dnncha/turbo-picard/tree/main/benchmarks</text>
</svg>
