  <rect width="420" height="1525" fill="url(#bg)"/>
  <rect width="420" height="1525" fill="url(#atmo)"/>
  <circle cx="25" cy="36" r="3.5" fill="#34d399"/>
  <text x="35" y="40" class="brand">TURBO PICARD</text>
  <text x="164" y="40" class="brandMeta">· NO JVM</text>
  <text x="20" y="76" class="title">The fastest</text><text x="20" y="109" class="title">MarkDuplicates we&#x27;ve</text><text x="20" y="142" class="title">measured.</text>
  <text x="20" y="166" class="sub">And the only one with Picard-identical</text><text x="20" y="186" class="sub">output. Native Rust across 41 commands;</text><text x="20" y="206" class="sub">zero JVM.</text>
  <rect x="20" y="228" width="380" height="336" rx="14" class="panel"/><text x="36" y="253" class="panelHead">MARKDUPLICATES · 600K PAIRED · 1 CPU</text><line x1="36" y1="264" x2="384" y2="264" class="rule"/><text x="36" y="283" class="groupOn">PICARD-IDENTICAL OUTPUT</text><rect x="30" y="295" width="360" height="48" rx="9" class="winRow"/><rect x="30" y="295" width="3.5" height="48" rx="2" fill="#34d399"/><text x="36" y="313" class="toolOn">Turbo Picard</text><rect x="146" y="299" width="79" height="18" rx="9" fill="#10b981" stroke="none"/><text x="185.5" y="311.5" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#031a12">#1 FASTEST</text><rect x="36" y="320" width="230" height="15" rx="4" class="track"/><rect x="36" y="320" width="44.7" height="15" rx="4" fill="url(#turbo)"/><text x="276" y="332" class="valueOn">1.05 s · 94 MiB</text><text x="36" y="367" class="tool">Picard 3.4.0</text><rect x="36" y="374" width="230" height="15" rx="4" class="track"/><rect x="36" y="374" width="230.0" height="15" rx="4" fill="#4c6472"/><text x="276" y="386" class="value">5.42 s · 1.03 GiB</text><text x="36" y="419" class="groupOff">OUTPUT DIFFERS FROM PICARD</text><text x="36" y="449" class="toolOff">FastDup</text><rect x="36" y="456" width="230" height="15" rx="4" class="track"/><rect x="36" y="456" width="48.0" height="15" rx="4" fill="#263340"/><text x="276" y="468" class="valueOff">1.13 s · 384 MiB</text><text x="36" y="503" class="toolOff">samtools markdup</text><rect x="36" y="510" width="230" height="15" rx="4" class="track"/><rect x="36" y="510" width="84.1" height="15" rx="4" fill="#263340"/><text x="276" y="522" class="valueOff">1.98 s · 236 MiB</text><text x="36" y="552" class="panelFoot">BAM level 5 · Only Turbo Picard matches Picard</text>
  <rect x="20" y="578" width="380" height="338" rx="14" class="panel"/><text x="36" y="603" class="panelHead">4X GRCH38 WGS · VS RIKER &amp; PICARD</text><line x1="36" y1="614" x2="384" y2="614" class="rule"/><text x="36" y="633" class="groupOn">WALL TIME (COLD CACHE)</text><rect x="30" y="643" width="360" height="44" rx="8" class="winRow"/><rect x="30" y="643" width="3.5" height="44" rx="2" fill="#34d399"/><text x="36" y="660" class="toolOn">Turbo Picard</text><rect x="140" y="646" width="85" height="18" rx="9" fill="#10b981" stroke="none"/><text x="182.5" y="658.5" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#031a12">1.3x faster</text><rect x="36" y="666" width="222" height="14" rx="4" class="track"/><rect x="36" y="666" width="165.9" height="14" rx="4" fill="url(#turbo)"/><text x="384" y="678" text-anchor="end" class="valueOn">21.8–22.6 s</text><text x="36" y="707" class="toolOff">riker wgs 0.5.0</text><rect x="36" y="713" width="222" height="14" rx="4" class="track"/><rect x="36" y="713" width="222.0" height="14" rx="4" fill="#263340"/><text x="384" y="725" text-anchor="end" class="valueOff">29.7 s (differs)</text><text x="36" y="751" class="groupOn">PEAK MEMORY (RSS)</text><rect x="30" y="761" width="360" height="44" rx="8" class="winRow"/><rect x="30" y="761" width="3.5" height="44" rx="2" fill="#34d399"/><text x="36" y="778" class="toolOn">Turbo Picard</text><rect x="140" y="764" width="98" height="18" rx="9" fill="#10b981" stroke="none"/><text x="189.0" y="776.5" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#031a12">4.0x less RAM</text><rect x="36" y="784" width="222" height="14" rx="4" class="track"/><rect x="36" y="784" width="55.1" height="14" rx="4" fill="url(#turbo)"/><text x="384" y="796" text-anchor="end" class="valueOn">125 MB</text><text x="36" y="825" class="toolOff">riker wgs 0.5.0</text><rect x="36" y="831" width="222" height="14" rx="4" class="track"/><rect x="36" y="831" width="222.0" height="14" rx="4" fill="#263340"/><text x="384" y="843" text-anchor="end" class="valueOff">504 MB (differs)</text><rect x="36" y="856" width="348" height="46" rx="8" class="insetBox"/><text x="46" y="874" class="insetText">Picard 3.5.0 (1T): <tspan fill="#e2e8f0" font-weight="700">1,033.8 s · 1,468 MB</tspan></text><text x="46" y="891" class="insetText"><tspan fill="#6ee7b7" font-weight="700">Turbo Picard: ~47x faster &amp; 11.7x less RAM (exact)</tspan></text>
  <rect x="20" y="930" width="380" height="68" rx="12" class="tileAccent"/><text x="36" y="974" class="bigOn">5.1x</text><text x="152" y="959" class="tileText">faster than Picard</text><text x="152" y="978" class="tileFine">600k paired reads</text>
  <rect x="20" y="1008" width="380" height="68" rx="12" class="tile"/><text x="36" y="1052" class="big">11.2x</text><text x="152" y="1037" class="tileText">less memory than Picard</text><text x="152" y="1056" class="tileFine">600k paired reads</text>
  <rect x="20" y="1086" width="380" height="68" rx="12" class="tileAccent"/><text x="36" y="1130" class="bigOn">19.0x</text><text x="152" y="1115" class="tileText">faster than Picard</text><text x="152" y="1134" class="tileFine">real NA12878 chrM, identical</text>
  <rect x="20" y="1164" width="380" height="68" rx="12" class="tile"/><text x="36" y="1208" class="big">32/32</text><text x="152" y="1193" class="tileText">commands match Picard</text><text x="152" y="1212" class="tileFine">85x geo-mean speedup</text>
  <rect x="20" y="1246" width="380" height="128" rx="14" class="panel"/><text x="38" y="1272" class="groupOn">GETTING FASTER ON MAIN</text><polygon points="38.0,1316.0 38.0,1298.0 65.0,1292.8 92.0,1280.0 92.0,1316.0" fill="url(#sparkArea)"/><polyline points="38.0,1298.0 65.0,1292.8 92.0,1280.0" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="92.0" cy="1280.0" r="3.5" fill="#a7f3d0"/><text x="108" y="1300" class="tileText">MarkDuplicates paired, 600k</text><text x="108" y="1317" class="tileFine">0.1.15 → #46</text><text x="382" y="1302" text-anchor="end" class="valueOn">−64%</text><polygon points="38.0,1360.0 38.0,1342.0 65.0,1337.3 92.0,1324.0 92.0,1360.0" fill="url(#sparkArea)"/><polyline points="38.0,1342.0 65.0,1337.3 92.0,1324.0" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="92.0" cy="1324.0" r="3.5" fill="#a7f3d0"/><text x="108" y="1344" class="tileText">MarkDuplicates paired, 1.2M</text><text x="108" y="1361" class="tileFine">0.1.15 → #46</text><text x="382" y="1346" text-anchor="end" class="valueOn">−60%</text>
  <rect x="20" y="1388" width="380" height="44" rx="10" class="cmdBox"/><text x="38" y="1415.0" class="cmd"><tspan class="prompt">$</tspan><tspan dx="10">pip install turbo-picard</tspan></text>
  <text x="20" y="1458" class="foot">MarkDuplicates (600k paired reads, 1 CPU, 2026-10-25, 0.1.16</text><text x="20" y="1473" class="foot">a4aeaa8+patch). WGS: 1000G HG02675 4x GRCh38 (6T, 2026-11-13).</text><text x="20" y="1488" class="foot">Suite: 2026-08-14. Evidence:</text><text x="20" y="1503" class="foot">github.com/dnncha/turbo-picard/tree/main/benchmarks</text>
</svg>
