    .foot { font-weight: 500; font-size: 11.5px; fill: #64748b; }
    .cmdBox { fill: #0f1820; stroke: rgba(52,211,153,0.32); }
    .cmd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-weight: 600; font-size: 15.5px; fill: #f8fafc; }
