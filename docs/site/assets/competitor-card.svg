<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">The fastest MarkDuplicates we&#x27;ve measured. And the only one with Picard-identical output.</title>
  <desc id="desc">The fastest MarkDuplicates we&#x27;ve measured. And the only one with Picard-identical output. MarkDuplicates: Turbo Picard 1.05 s vs Picard 5.42 s; FastDup 1.13 s (output differs from Picard); samtools markdup 1.98 s (output differs from Picard). 4x GRCh38 WGS CollectWgsMetrics: Turbo Picard 21.8–22.6 s / 125 MB vs riker wgs 29.7 s / 504 MB vs Picard 1,033.8 s.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#060a0e"/>
      <stop offset="0.55" stop-color="#0b131a"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <radialGradient id="atmo" cx="0.22" cy="0.08" r="0.65">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="turbo" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="sparkArea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .brand { font-weight: 800; font-size: 12.5px; letter-spacing: 2px; fill: #34d399; }
    .brandMeta { font-weight: 600; font-size: 11px; letter-spacing: 1.4px; fill: #7e95a3; }
    .title { font-weight: 800; font-size: 33px; fill: #f8fafc; letter-spacing: -0.6px; }
    .sub { font-weight: 500; font-size: 16px; fill: #9fb4bf; }
    .panel { fill: #0e161d; stroke: rgba(148,163,184,0.16); }
    .panelHead { font-weight: 800; font-size: 11px; letter-spacing: 1.4px; fill: #cbd5e1; }
    .panelMeta { font-weight: 700; font-size: 10px; letter-spacing: 1.2px; fill: #64748b; }
    .panelFoot { font-weight: 500; font-size: 11px; fill: #64748b; }
    .rule { stroke: rgba(148,163,184,0.12); stroke-width: 1; }
    .gridLine { stroke: rgba(148,163,184,0.07); stroke-dasharray: 2 3; }
    .winRow { fill: rgba(16,185,129,0.10); stroke: rgba(52,211,153,0.34); }
    .insetBox { fill: rgba(255,255,255,0.03); stroke: rgba(148,163,184,0.12); }
    .insetText { font-weight: 500; font-size: 11px; fill: #94a3b8; }
