  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#atmo)"/>
  <circle cx="46" cy="40" r="4" fill="#34d399"/>
  <text x="58" y="44" class="brand">TURBO PICARD</text>
  <text x="204" y="44" class="brandMeta">· NO JVM · PICARD-IDENTICAL BENCHMARKS</text>
  <rect x="908" y="22" width="332" height="38" rx="10" class="cmdBox"/><text x="926" y="46.0" class="cmd"><tspan class="prompt">$</tspan><tspan dx="10">pip install turbo-picard</tspan></text>
  <text x="40" y="84" class="title">The fastest MarkDuplicates we&#x27;ve measured.</text>
  <text x="40" y="110" class="sub">And the only one with Picard-identical output. Native Rust across 41 commands; zero JVM.</text>
  <rect x="40" y="134" width="606" height="304" rx="14" class="panel"/><text x="62" y="160" class="panelHead">MARKDUPLICATES · 600K PAIRED · 1 CPU</text><text x="624" y="160" text-anchor="end" class="panelMeta">LOWER IS BETTER</text><line x1="62" y1="172" x2="624" y2="172" class="rule"/><line x1="284.5" y1="200" x2="284.5" y2="406" class="gridLine"/><line x1="355.0" y1="200" x2="355.0" y2="406" class="gridLine"/><line x1="425.5" y1="200" x2="425.5" y2="406" class="gridLine"/><line x1="496.0" y1="200" x2="496.0" y2="406" class="gridLine"/><text x="62" y="192" class="groupOn">PICARD-IDENTICAL OUTPUT</text><rect x="50" y="204" width="586" height="36" rx="8" class="winRow"/><rect x="50" y="204" width="4" height="36" rx="2" fill="#34d399"/><text x="62" y="227" class="toolOn">Turbo Picard</text><rect x="170" y="213" width="28" height="18" rx="9" fill="#10b981" stroke="none"/><text x="184.0" y="225.5" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#031a12">#1</text><rect x="214" y="213" width="282" height="18" rx="5" class="track"/><rect x="214" y="213" width="54.8" height="18" rx="5" fill="url(#turbo)"/><text x="624" y="227" text-anchor="end" class="valueOn">1.05 s · 94 MiB</text><text x="62" y="269" class="tool">Picard 3.4.0</text><rect x="214" y="255" width="282" height="18" rx="5" class="track"/><rect x="214" y="255" width="282.0" height="18" rx="5" fill="#4c6472"/><text x="624" y="269" text-anchor="end" class="value">5.42 s · 1.03 GiB</text><text x="62" y="304" class="groupOff">OUTPUT DIFFERS FROM PICARD</text><text x="62" y="339" class="toolOff">FastDup</text><rect x="214" y="325" width="282" height="18" rx="5" class="track"/><rect x="214" y="325" width="58.8" height="18" rx="5" fill="#263340"/><text x="624" y="339" text-anchor="end" class="valueOff">1.13 s · 384 MiB</text><text x="62" y="381" class="toolOff">samtools markdup</text><rect x="214" y="367" width="282" height="18" rx="5" class="track"/><rect x="214" y="367" width="103.1" height="18" rx="5" fill="#263340"/><text x="624" y="381" text-anchor="end" class="valueOff">1.98 s · 236 MiB</text><text x="62" y="424" class="panelFoot">Same coordinate BAM &amp; compression level 5 · Only Turbo Picard passes 100% Picard parity</text>
  <rect x="666" y="134" width="574" height="304" rx="14" class="panel"/><text x="688" y="160" class="panelHead">COLLECTWGSMETRICS · 4X GRCH38 WGS · 6T</text><text x="1218" y="160" text-anchor="end" class="panelMeta">VS RIKER &amp; PICARD</text><line x1="688" y1="172" x2="1218" y2="172" class="rule"/><text x="688" y="192" class="groupOn">WALL TIME (COLD CACHE)</text><rect x="676" y="202" width="554" height="34" rx="8" class="winRow"/><rect x="676" y="202" width="4" height="34" rx="2" fill="#34d399"/><text x="688" y="224" class="toolOn">Turbo Picard</text><rect x="786" y="210" width="26" height="18" rx="9" fill="#10b981" stroke="none"/><text x="799.0" y="222.5" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#031a12">#1</text><rect x="824" y="210" width="232" height="18" rx="5" class="track"/><rect x="824" y="210" width="173.4" height="18" rx="5" fill="url(#turbo)"/><text x="1218" y="224" text-anchor="end" class="valueOn">21.8–22.6 s · 1.3x faster</text><text x="688" y="262" class="toolOff">riker wgs 0.5.0</text><rect x="824" y="249" width="232" height="16" rx="4" class="track"/><rect x="824" y="249" width="232.0" height="16" rx="4" fill="#263340"/><text x="1218" y="262" text-anchor="end" class="valueOff">29.7 s · output differs</text><text x="688" y="292" class="groupOn">PEAK MEMORY (RSS)</text><rect x="676" y="302" width="554" height="34" rx="8" class="winRow"/><rect x="676" y="302" width="4" height="34" rx="2" fill="#34d399"/><text x="688" y="324" class="toolOn">Turbo Picard</text><rect x="786" y="310" width="26" height="18" rx="9" fill="#10b981" stroke="none"/><text x="799.0" y="322.5" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#031a12">#1</text><rect x="824" y="310" width="232" height="18" rx="5" class="track"/><rect x="824" y="310" width="57.5" height="18" rx="5" fill="url(#turbo)"/><text x="1218" y="324" text-anchor="end" class="valueOn">125 MB · 4.0x less RAM</text><text x="688" y="362" class="toolOff">riker wgs 0.5.0</text><rect x="824" y="349" width="232" height="16" rx="4" class="track"/><rect x="824" y="349" width="232.0" height="16" rx="4" fill="#263340"/><text x="1218" y="362" text-anchor="end" class="valueOff">504 MB · output differs</text><rect x="688" y="388" width="530" height="36" rx="8" class="insetBox"/><text x="700" y="410" class="insetText">Picard 3.5.0 (1T): <tspan fill="#e2e8f0" font-weight="700">1,033.8 s · 1,468 MB</tspan> <tspan fill="#6ee7b7" font-weight="700">→ ~47x faster &amp; 11.7x less RAM (exact parity)</tspan></text>
  <rect x="40" y="454" width="180" height="130" rx="12" class="tileAccent"/><text x="55" y="504" class="bigOn">5.1x</text><text x="55" y="536" class="tileText">faster than Picard</text><text x="55" y="558" class="tileFine">600k paired reads</text><rect x="234" y="454" width="180" height="130" rx="12" class="tile"/><text x="249" y="504" class="big">11.2x</text><text x="249" y="536" class="tileText">less memory than Picard</text><text x="249" y="558" class="tileFine">600k paired reads</text><rect x="428" y="454" width="180" height="130" rx="12" class="tileAccent"/><text x="443" y="504" class="bigOn">19.0x</text><text x="443" y="536" class="tileText">faster than Picard</text><text x="443" y="558" class="tileFine">real NA12878 chrM, identical</text><rect x="622" y="454" width="180" height="130" rx="12" class="tile"/><text x="637" y="504" class="big">32/32</text><text x="637" y="536" class="tileText">commands match Picard</text><text x="637" y="558" class="tileFine">85x geo-mean speedup</text>
  <rect x="818" y="454" width="422" height="130" rx="14" class="panel"/><text x="836" y="480" class="groupOn">GETTING FASTER ON MAIN</text><polygon points="836.0,524.0 836.0,506.0 875.0,500.8 914.0,488.0 914.0,524.0" fill="url(#sparkArea)"/><polyline points="836.0,506.0 875.0,500.8 914.0,488.0" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="914.0" cy="488.0" r="3.5" fill="#a7f3d0"/><text x="930" y="508" class="tileText">MarkDuplicates paired, 600k</text><text x="930" y="525" class="tileFine">0.1.15 → #46</text><text x="1222" y="510" text-anchor="end" class="valueOn">−64%</text><polygon points="836.0,568.0 836.0,550.0 875.0,545.3 914.0,532.0 914.0,568.0" fill="url(#sparkArea)"/><polyline points="836.0,550.0 875.0,545.3 914.0,532.0" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="914.0" cy="532.0" r="3.5" fill="#a7f3d0"/><text x="930" y="552" class="tileText">MarkDuplicates paired, 1.2M</text><text x="930" y="569" class="tileFine">0.1.15 → #46</text><text x="1222" y="554" text-anchor="end" class="valueOn">−60%</text>
  <text x="40" y="618" class="foot">MarkDuplicates (600k paired reads, 1 CPU, 2026-10-25, 0.1.16 a4aeaa8+patch). WGS: 1000G HG02675 4x GRCh38 (6T, 2026-11-13). Suite: 2026-08-14. Evidence: github.com/dnncha/turbo-picard/tree/main/benchmarks</text>
</svg>
