<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">The fastest MarkDuplicates we&#x27;ve measured. And the only one with Picard-identical output.</title>
  <desc id="desc">The fastest MarkDuplicates we&#x27;ve measured. And the only one with Picard-identical output. Turbo Picard 1.05 s versus Picard 5.42 s; FastDup 1.13 s (output differs from Picard); samtools markdup 1.98 s (output differs from Picard).</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071013"/>
      <stop offset="0.55" stop-color="#10212a"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="turbo" x1="0" x2="1">
      <stop offset="0" stop-color="#2fcfc2"/>
      <stop offset="1" stop-color="#9ef8f1"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .brand { font-weight: 700; font-size: 16px; letter-spacing: 2px; fill: #36d7c9; }
    .title { font-weight: 800; font-size: 40px; fill: #f4fbfb; }
    .sub { font-weight: 500; font-size: 19px; fill: #b7c9cf; }
    .groupOn { font-weight: 700; font-size: 12px; letter-spacing: 1.5px; fill: #36d7c9; }
    .groupOff { font-weight: 700; font-size: 12px; letter-spacing: 1.5px; fill: #6d8189; }
    .toolOn { font-weight: 800; font-size: 17px; fill: #f4fbfb; }
    .tool { font-weight: 600; font-size: 16px; fill: #d9e7ea; }
    .toolOff { font-weight: 600; font-size: 16px; fill: #7d9098; }
    .valueOn { font-weight: 800; font-size: 16px; fill: #9ef8f1; }
    .value { font-weight: 700; font-size: 15px; fill: #d9e7ea; }
    .valueOff { font-weight: 600; font-size: 15px; fill: #7d9098; }
    .track { fill: rgba(255,255,255,0.05); }
    .tile { fill: rgba(255,255,255,0.045); stroke: rgba(158,248,241,0.14); }
    .bigOn { font-weight: 800; font-size: 38px; fill: #9ef8f1; }
    .big { font-weight: 800; font-size: 38px; fill: #f4fbfb; }
    .tileText { font-weight: 600; font-size: 15px; fill: #d9e7ea; }
    .tileFine { font-weight: 500; font-size: 13px; fill: #8ba4ad; }
    .foot { font-weight: 500; font-size: 12.5px; fill: #6d8189; }
    .cmd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-weight: 600; font-size: 19px; fill: #f4fbfb; }
    .prompt { fill: #36d7c9; }
  </style>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <text x="56" y="52" class="brand">TURBO PICARD</text>
  <text x="56" y="98" class="title">The fastest MarkDuplicates we&#x27;ve measured.</text>
  <text x="56" y="128" class="sub">And the only one with Picard-identical output. Same commands, same arguments, no JVM.</text>
  <text x="56" y="182" class="groupOn">PICARD-IDENTICAL OUTPUT</text><text x="56" y="222" class="toolOn">Turbo Picard</text><rect x="224" y="202" width="404" height="28" rx="7" class="track"/><rect x="224" y="202" width="78.5" height="28" rx="7" fill="url(#turbo)" filter="url(#glow)"/><text x="312.5" y="222" class="valueOn">1.05 s</text><text x="56" y="268" class="tool">Picard 3.4.0</text><rect x="224" y="248" width="404" height="28" rx="7" class="track"/><rect x="224" y="248" width="404.0" height="28" rx="7" fill="#3a5a63"/><text x="638.0" y="268" class="value">5.42 s</text><text x="56" y="308" class="groupOff">OUTPUT DIFFERS FROM PICARD</text><text x="56" y="348" class="toolOff">FastDup</text><rect x="224" y="328" width="404" height="28" rx="7" class="track"/><rect x="224" y="328" width="84.2" height="28" rx="7" fill="#2a3a40"/><text x="318.2" y="348" class="valueOff">1.13 s</text><text x="56" y="394" class="toolOff">samtools markdup</text><rect x="224" y="374" width="404" height="28" rx="7" class="track"/><rect x="224" y="374" width="147.7" height="28" rx="7" fill="#2a3a40"/><text x="381.7" y="394" class="valueOff">1.98 s</text>
  <rect x="800" y="140" width="204" height="112" rx="14" class="tile"/><text x="818" y="190" class="bigOn">5.1x</text><text x="818" y="218" class="tileText">faster than Picard</text><text x="818" y="237" class="tileFine">600k paired reads</text><rect x="1020" y="140" width="204" height="112" rx="14" class="tile"/><text x="1038" y="190" class="big">11.2x</text><text x="1038" y="218" class="tileText">less memory than Picard</text><text x="1038" y="237" class="tileFine">600k paired reads</text><rect x="800" y="268" width="204" height="112" rx="14" class="tile"/><text x="818" y="318" class="bigOn">19.0x</text><text x="818" y="346" class="tileText">faster than Picard</text><text x="818" y="365" class="tileFine">real NA12878 chrM, identical</text><rect x="1020" y="268" width="204" height="112" rx="14" class="tile"/><text x="1038" y="318" class="big">32/32</text><text x="1038" y="346" class="tileText">commands match Picard</text><text x="1038" y="365" class="tileFine">85x geo-mean speedup</text>
  <rect x="800" y="400" width="424" height="136" rx="14" class="tile"/><text x="818" y="428" class="groupOn">GETTING FASTER ON MAIN</text><polyline points="818.0,456.0 862.0,450.8 906.0,438.0" fill="none" stroke="#36d7c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="906.0" cy="438.0" r="3.5" fill="#9ef8f1"/><text x="922" y="458" class="tileText">MarkDuplicates paired, 600k</text><text x="922" y="475" class="tileFine">0.1.15 → #46</text><text x="1206" y="458" text-anchor="end" class="valueOn">−64%</text><polyline points="818.0,502.0 862.0,497.3 906.0,484.0" fill="none" stroke="#36d7c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="906.0" cy="484.0" r="3.5" fill="#9ef8f1"/><text x="922" y="504" class="tileText">MarkDuplicates paired, 1.2M</text><text x="922" y="521" class="tileFine">0.1.15 → #46</text><text x="1206" y="504" text-anchor="end" class="valueOn">−60%</text>
  <rect x="56" y="490" width="372" height="48" rx="12" class="tile"/><text x="76" y="521" class="cmd"><tspan class="prompt">$</tspan><tspan dx="12">pip install turbo-picard</tspan></text>
  <text x="56" y="614" class="foot">MarkDuplicates, 600k paired reads, 1 CPU, median of 3. Turbo Picard 0.1.16 (a4aeaa8+patch), measured 2026-10-25. Command suite 2026-08-14. Evidence: github.com/dnncha/turbo-picard/tree/main/benchmarks</text>
</svg>
