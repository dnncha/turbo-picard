<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1398" viewBox="0 0 1280 1398" role="img" aria-labelledby="title desc">
  <title id="title">Same Picard checks. Less waiting.</title>
  <desc id="desc">Bar chart showing 32 Picard-compatible commands with parity passing and speedups from 22.88x to 272.12x.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071013"/>
      <stop offset="0.55" stop-color="#10212a"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
