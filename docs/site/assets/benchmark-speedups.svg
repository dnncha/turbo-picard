<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1246" viewBox="0 0 1280 1246" role="img" aria-labelledby="title desc">
  <title id="title">turbo-picard benchmark speedups versus Picard</title>
  <desc id="desc">Bar chart showing 28 Picard-compatible commands with parity passing and speedups from 6.69x to 104.68x.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
