name: HMMForge evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -e '.[test]'
          sudo apt-get update -qq
          sudo apt-get install -y hmmer
      - name: Unit and integration tests
        run: |
          mkdir -p evidence
          python -m pytest -q --junitxml=evidence/tests.xml
      - name: Biological and synthetic parity
        run: |
          python scripts/make_fixture.py evidence/synthetic
          python scripts/backend_fixture.py evidence/biological
          hmmforge benchmark evidence/synthetic/models.hmm evidence/synthetic/proteins.fa --cpus 2 --repeats 3 --dataset-kind synthetic > evidence/synthetic.json
          hmmforge benchmark evidence/biological/models.hmm evidence/biological/proteins.fa --cpus 2 --repeats 3 --dataset-kind biological > evidence/biological.json
          python scripts/native_check.py evidence/synthetic/models.hmm evidence/synthetic/proteins.fa --cpus 2 > evidence/native-synthetic.json
          python scripts/native_check.py evidence/biological/models.hmm evidence/biological/proteins.fa --cpus 2 > evidence/native-biological.json
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hmmforge-evidence
          path: evidence/
          retention-days: 14
