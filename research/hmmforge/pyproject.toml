[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hmmforge"
version = "0.1.0a3"
description = "Experimental bounded-batch protein domain annotation with scan-statistics validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Donncha O'Toole"}]
dependencies = ["pyhmmer==0.12.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hmmforge = "hmmforge.__main__:main"
hmmforge-study = "hmmforge.study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
