[workspace]
members = [
  "crates/turbo-picard-cli",
  "crates/turbo-picard-core",
  "crates/turbo-picard-markdup",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dnncha/turbo-picard"
homepage = "https://github.com/dnncha/turbo-picard"

[profile.release]
codegen-units = 1
lto = "thin"
