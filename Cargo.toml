[workspace]
members = [
  "crates/turbo-picard-cli",
  "crates/turbo-picard-core",
  "crates/turbo-picard-markdup",
]
resolver = "3"

[workspace.package]
version = "0.1.17"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dnncha/turbo-picard"
homepage = "https://github.com/dnncha/turbo-picard"

[workspace.dependencies]
assert_cmd = "2.2.2"
crossbeam-channel = "0.5"
expect-test = "1.5.1"
flate2 = "1.1.5"
hts-sys = "2.2.0"
md5 = "0.8.0"
predicates = "3.1.3"
regex = "1.11.1"
rust-htslib = { version = "1.0.0", features = ["libdeflate"] }
rustc-hash = "2.1.2"
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
similar_names = "allow"
doc_markdown = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
