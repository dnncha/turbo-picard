[workspace]
members = [
  "crates/turbo-picard-cli",
  "crates/turbo-picard-core",
  "crates/turbo-picard-markdup",
]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dnncha/turbo-picard"
homepage = "https://github.com/dnncha/turbo-picard"

[workspace.dependencies]
assert_cmd = "2.2.2"
crossbeam-channel = "0.5"
flate2 = "1.1.5"
hts-sys = "2.2.0"
md5 = "0.8.0"
predicates = "3.1.3"
rust-htslib = "1.0.0"
rustc-hash = "2.1.2"
tempfile = "3.27.0"
thiserror = "2.0.18"

[profile.release]
codegen-units = 1
lto = "thin"
